# ───────────── Font ─────────────
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# ───────────── Cursor ─────────────
cursor_shape          block
cursor_blink_interval 0
cursor_text_color     #14121f
cursor                #f2b13c

# ───────────── Window ─────────────
window_padding_width     12
background_opacity         0.80
# ctrl+shift+a>m / ctrl+shift+a>l to adjust live
dynamic_background_opacity yes
background_blur            40

confirm_os_window_close  0
enable_audio_bell        no
scrollback_lines         10000
# hide_window_decorations yes

# ───────────── Tab bar ─────────────
tab_bar_min_tabs        2
tab_bar_style           fade
tab_fade                0.25 0.5 0.75 1
active_tab_foreground   #14121f
active_tab_background   #7b9cf5
inactive_tab_foreground #7a7894
inactive_tab_background #1d1b2b

# ───────────── Colors ─────────────
foreground              #d4d6e4
background              #13111d
selection_foreground    none
selection_background    #2f2b4d
url_color               #7b9cf5

active_border_color     #7b9cf5
inactive_border_color   #2a2740

# black (also used for dim/gray text such as pkg + clock)
color0   #1d1b2b
color8   #7a7894

# red  (rust version, strings, errors)
color1   #d9625a
color9   #f07178

# green (node version, success)
color2   #8fbf6f
color10  #c3e88d

# yellow (prompt ring, "sleep", python version)
color3   #e0af3f
color11  #f5d94e

# blue (directory names, repo name)
color4   #7b9cf5
color12  #92b4ff

# magenta / purple (git branch)
color5   #a77de6
color13  #c09bf5

# cyan (builtins like cd/echo, "false")
color6   #4fb4e8
color14  #6bd0f5

# white
color7   #c8cad8
color15  #f0f0f8
